[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ooxml-behavioral-intelligence"
version = "0.4.0"
description = "Open behavioral knowledge base and tooling for OOXML interoperability"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Nessim Liamani" }]
# The tools in tools/ use only the standard library; extras are for validation and development.
dependencies = []

[project.optional-dependencies]
validate = ["pyyaml>=6", "jsonschema>=4.18"]
dev = ["pyyaml>=6", "jsonschema>=4.18", "pytest>=7", "ruff>=0.5", "python-docx", "openpyxl"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "tests"]

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = ["datasets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
